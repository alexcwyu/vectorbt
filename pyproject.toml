[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorbt"
version = "1.1.2"
description = "Python library for backtesting and analyzing trading strategies at scale"
readme = "README.md"
license-files = ["LICENSE.md"]
authors = [
    {name = "Oleg Polakow", email = "olegpolakow@vectorbt.pro"}
]
requires-python = ">=3.13,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3,<4.0",
    "scipy",
    "matplotlib",
    "plotly>=4.12.0",
    "ipywidgets>=7.0.0",
    "anywidget",
    "numba>=0.66",
    "dill",
    "tqdm",
    "dateparser",
    "imageio",
    "scikit-learn",
    "schedule",
    "requests",
    "pytz",
    "mypy_extensions",
]

[project.optional-dependencies]
rust = [
    "vectorbt-rust==1.1.2",
]
full = [
    "TA-Lib",
    "yfinance>=0.2.22",
    "python-binance",
    "ccxt>=4.0.14",
    "alpaca-py",
    "ray>=1.4.1",
    "ta",
    "pandas-ta-classic",
    "python-telegram-bot>=13.4",
    "quantstats>=0.0.37",
    "kaleido>=1",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "codecov",
]
test-rust = [
    "vectorbt[test]",
    "maturin>=1.14,<2.0",
]
docs = [
    "zensical>=0.0.62",
    "tomlkit>=0.13",
    "mako",
]
all = [
    "vectorbt[rust]",
    "vectorbt[full]",
    "vectorbt[test]",
    "vectorbt[docs]",
]

[project.urls]
Homepage = "https://github.com/polakowo/vectorbt"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorbt"]

[tool.hatch.build.targets.wheel.shared-data]
"src/vectorbt/templates" = "vectorbt/templates"

[tool.hatch.build.targets.sdist]
include = [
    "src/vectorbt/**",
    "README.md",
    "LICENSE.md",
]
exclude = [
    "tests/**",
    "docs/**",
    "examples/**",
    "scripts/**",
    "apps/**",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=6.0.0",
    "mypy>=1.18.2",
    "ruff>=0.14.5",
]

[tool.uv]
override-dependencies = [
    # pandas-ta requires numba==0.61.2, but we need numba>=0.62.1 for Python 3.13
    "numba>=0.62.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["vectorbt"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

[tool.uv.sources]
vectorbt-rust = { path = "rust" }
